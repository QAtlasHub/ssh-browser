name: typos

# Spell / typo check across the repo. Read-only: the action defaults to
# fail-on-typos (no auto-fix).
# To allow a flagged word, add it under [default.extend-words] in .typos.toml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b     # v1.50.1
