name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # rust-cache v2.9 turned `cache-bin: true` on by default, and the
          # macOS-arm64 cache slot can capture a poisoned `~/.cargo/bin/cargo`
          # that resolves to rustup-init, so `cargo test ...` fails with
          # `unexpected argument 'test'`. dtolnay/rust-toolchain above already
          # installs cargo fresh; a stale binary cache must not be restored over
          # it. `target/` and the registry stay cached.
          cache-bin: false
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # See the clippy job for the cache-bin rationale.
          cache-bin: false
      - run: cargo test --workspace --all-targets

  msrv:
    # MSRV is pinned in Cargo.toml / clippy.toml; the job name omits the version
    # literal so the label cannot drift away from the pin.
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo build --workspace

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  versions:
    # One tag ships the crate and the extension together, so the two have to agree about
    # what version that is. Checked on every pull request rather than only at release,
    # because the release is the worst place to find out: release-plz bumps `Cargo.toml`
    # and knows nothing about `manifest.json`, and the Chrome Web Store refuses an upload
    # whose version it has already seen.
    name: versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: the crate and the extension must be the same version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ext=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' extension/manifest.json | head -1)
          echo "crate $crate, extension $ext"
          test -n "$crate"
          test -n "$ext"
          if [ "$crate" != "$ext" ]; then
            echo "::error::Cargo.toml is $crate but extension/manifest.json is $ext"
            exit 1
          fi

  extension:
    # The browser half typechecks and bundles here for the same reason the daemon builds
    # here: the two ship through different channels, and CI is the only place that sees
    # both at the same version.
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm --prefix extension ci
      - run: npm --prefix extension run typecheck
      - run: npm --prefix extension run build

  e2e:
    # The only check that tests the claim rather than a piece of it: that a file on a host
    # reachable only over SSH renders in a browser as it would anywhere else. It opens the
    # same bytes twice, once through the daemon and once over file://, and the difference
    # between the two is the reason this project exists. No unit test can stand in for it,
    # because the thing being claimed is about a browser.
    name: e2e (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-bin: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          # Both, because this job needs the extension built as well as the harness
          # installed. The `extension` job builds it too, but jobs do not share a workspace.
          cache-dependency-path: |
            e2e/package-lock.json
            extension/package-lock.json

      - name: Local sshd
        # The same arrangement as the roundtrips job. The daemon only ever speaks to a host
        # through `ssh -s sftp`, so a real sshd on loopback exercises the actual transport
        # rather than a stand-in for it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts

      - run: cargo build --bin ssh-browser

      # The harness loads the extension unpacked, so it needs it built here rather than in
      # the `extension` job, which runs in a workspace of its own.
      - run: npm --prefix extension ci
      - run: npm --prefix extension run build

      - run: npm --prefix e2e ci
      - run: npm --prefix e2e run browser
      - run: npm --prefix e2e run e2e

  roundtrips:
    # Invariant 1 as a check rather than a claim: round trips for a batch of N
    # must not grow with N. measure-roundtrips exits non-zero on a serial
    # verdict, so a regression that only costs latency -- the kind no unit test
    # notices -- fails here instead of shipping.
    name: roundtrips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          cache-bin: false

      - name: Local sshd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts

      - name: Inject a realistic RTT
        # Over raw loopback tau collapses into scheduler noise and the
        # pipelined-versus-serial ratio stops being measurable at all. 10 ms each
        # way puts tau near what a real host costs.
        run: |
          sudo tc qdisc add dev lo root netem delay 10ms
          tc qdisc show dev lo

      - run: cargo build --release --example measure-roundtrips

      - name: Round trips stay flat as the batch grows
        run: ./target/release/examples/measure-roundtrips localhost /usr/include
