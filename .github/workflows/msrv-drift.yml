name: msrv-drift

# Detects the round-3 scenario: a transitive crate bumps its required
# Rust version above ssh-browser's declared MSRV (1.88 at HEAD).
#
# How it works:
#   - Use the MSRV toolchain (1.88).
#   - Build with NO committed Cargo.lock, forcing fresh resolution
#     against the current registry. If a transitive crate has moved its
#     `rust-version` past 1.88 since the last successful run, the build
#     fails here and we open a tracking issue.
#
# Distinct from ci.yml's `msrv` job (which builds against whatever lock
# state is in the working tree at PR time). This workflow specifically
# probes the *future* MSRV pressure that arrives via cargo update.

on:
  schedule:
    - cron: "0 7 * * 1"   # Mon 07:00 UTC, aligned with audit.yml
  workflow_dispatch:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".github/workflows/msrv-drift.yml"

permissions:
  contents: read

jobs:
  drift-check:
    name: MSRV drift (1.88 against latest deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.88"

      - name: Sanity — print toolchain and resolve hint
        run: |
          rustc --version
          cargo --version
          echo "Resolving with no committed Cargo.lock."

      - name: Build at MSRV against latest registry
        # If this fails, anyone on stable >= 1.88 hits the same failure once
        # their lock file refreshes. The tracking issue below then asks the
        # maintainer to either bump the declared MSRV or pin the offending
        # transitive crate.
        run: cargo build --workspace

  notify-cron-failure:
    name: notify (cron failure)
    needs: [drift-check]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "msrv-drift: weekly check failed ($(date -u +%Y-%m-%d))" \
            --label "ci,msrv,automated" \
            --body "The scheduled \`msrv-drift\` check failed: a transitive crate moved its required Rust version above the declared MSRV (1.88), or another build error occurred.

          See ${RUN_URL} for the failing build.

          Typical fixes:
          - Bump the declared MSRV in \`Cargo.toml\`, \`clippy.toml\` and \`ci.yml\` (msrv job).
          - Or pin the offending crate to an older minor version in \`Cargo.toml\` workspace deps.

          This issue was opened automatically; close it once the drift is resolved." \
            --repo "${{ github.repository }}"
