name: Release assets

# The other half of a release: the extension, attached to the release the crate got.
#
# Called from `release-plz.yml` rather than triggered by `release: published`. That is the
# whole reason this file is shaped as a reusable workflow: a release created by a workflow
# using the built-in `GITHUB_TOKEN` does not raise events that start other workflows, so the
# first version of this never ran at all. Being called lives inside the same run, which has
# no such restriction.
#
# Still its own file, because the two halves fail for unrelated reasons. A crates.io refusal
# and a broken npm install have nothing to do with each other, and a release that published
# the crate but could not build the zip should say exactly that.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to attach the extension to
        required: true
        type: string
  # So an asset can be rebuilt and reattached without cutting a version again.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach the extension to
        required: true

permissions:
  contents: read

jobs:
  daemon:
    # A binary per platform, so installing the daemon is a download rather than a Rust
    # toolchain and a C compiler. The extension is on the store now, which means people arrive
    # without either.
    #
    # Unsigned, deliberately. Gatekeeper and SmartScreen act on a flag the *downloading
    # application* attaches — `com.apple.quarantine`, Mark-of-the-Web — and `curl` and `scp` do
    # not attach one. A command-line tool installed the way command-line tools are installed
    # meets neither. Signing would cost a few hundred a year to remove a warning on the one
    # route the README does not recommend.
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # Every platform that can build should, even when one cannot. A macOS runner out of
      # capacity is not a reason to leave Linux users with nothing.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            exe: ""
          # Built on the older runner on purpose: a binary linked against a newer glibc will
          # not start on an older one, and the people this is for are on login nodes somebody
          # else administers. `musl` would remove the floor entirely and is not here yet,
          # because `ring` wants a C toolchain targeting musl and an untested build inside a
          # release job fails at the worst possible moment.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            exe: ""
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # `--locked` so the binary somebody downloads was built from the dependency versions in
      # the tag rather than from whatever resolved on the day.
      - name: build
        run: cargo build --release --locked --bin ssh-browser --target ${{ matrix.target }}

      # Named for the target rather than the runner: that is the string a reader matches
      # against their own machine, and it is what `cargo-binstall` looks for.
      - name: name it after the platform
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          out="ssh-browser-$version-$TARGET$EXE"
          cp "target/$TARGET/release/ssh-browser$EXE" "$out"
          # Published so somebody can check what they downloaded against what this built,
          # which is what an unsigned binary can offer instead of a signature.
          shasum -a 256 "$out" > "$out.sha256"
          cat "$out.sha256"
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  extension:
    name: attach the extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # One tag ships both halves, so both halves have to agree about what version that is.
      # release-plz bumps `Cargo.toml` and knows nothing about `manifest.json`, so without
      # this the zip on a v0.2.0 release would be labelled 0.1.0 — and the Chrome Web Store
      # refuses an upload whose version it has already seen, which is a confusing way to
      # find that out.
      - name: the crate and the extension must be the same version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ext=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' extension/manifest.json | head -1)
          echo "crate $crate, extension $ext"
          if [ "$crate" != "$ext" ]; then
            echo "::error::Cargo.toml is $crate but extension/manifest.json is $ext." \
                 "Bump the manifest in the release pull request."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm --prefix extension ci
      - run: npm --prefix extension run build
      - run: npm --prefix extension run package

      # The zip is byte-identical between runs by construction: fixed DOS timestamps and
      # sorted entries. The checksum is published so somebody can compare the one they
      # downloaded against the one they built, which is the only thing that makes being
      # reproducible worth anything.
      - name: checksum
        working-directory: extension
        run: |
          zip=$(ls ssh-browser-*.zip)
          sha256sum "$zip" > "$zip.sha256"
          cat "$zip.sha256"

      - name: upload
        working-directory: extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" ssh-browser-*.zip ssh-browser-*.zip.sha256 --clobber
