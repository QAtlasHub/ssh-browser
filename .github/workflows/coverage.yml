name: coverage

# Workspace line coverage via `cargo-llvm-cov`, uploaded to Codecov.
#
# Deliberately NOT a required check: a Codecov hiccup must not block a merge, so
# the upload runs with `fail_ci_if_error: false`. `CODECOV_TOKEN` is an
# organisation-wide secret rather than one set per repository, so there is nothing
# to configure here. If it is ever not visible to this repo the upload becomes a
# no-op rather than a failure, and the coverage measurement itself still runs.
#
# Third-party Actions are SHA-pinned, reusing the SHAs from ci.yml where they
# overlap.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: llvm-cov + codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af  # v2.87.11
        with:
          tool: cargo-llvm-cov
      - name: Generate workspace coverage (lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          # Named rather than detected: auto-detection mis-routes uploads from pull
          # requests opened from a fork.
          slug: QAtlasHub/ssh-browser
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
