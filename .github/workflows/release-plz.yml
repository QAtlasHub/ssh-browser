name: Release

# Two jobs, both on main. `release-pr` keeps a pull request open that bumps the version and
# says what would go out; `release` publishes what landed. Which of them does anything is
# release-plz's decision, not this file's.
#
# The extension is not built here. It is attached to the release this produces, by
# `release-assets.yml`, so that one tag ships both halves without this job needing to know
# anything about npm.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: publish and tag
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
      # crates.io Trusted Publishing. release-plz exchanges GitHub's OIDC identity for a
      # token that lives thirty minutes, so there is no CARGO_REGISTRY_TOKEN in this
      # repository to leak, rotate, or forget about. It needs a one-time trusted-publisher
      # entry on crates.io naming this repository and this workflow file.
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz reads the history to work out what changed since the last release,
          # so a shallow clone would have it treat everything as new.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: release-plz/action@a80d79efe0a195618acb02a4089d55fe74d2505f # v0.5.136
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Which tag to hang the extension on: the version that was just released, spelled the
      # way release-plz spells it. `v0.1.0` is what it produced for this workspace.
      #
      # That is an observation rather than a promise, so the tag has to exist before this
      # will hand it on. If release-plz ever changes the format, releases stop with a
      # message naming the tag it looked for — which is the failure worth having, because
      # the alternative is quietly attaching a zip to the previous release.
      #
      # Not `git describe`: that answers with the nearest *reachable* tag, so on a run that
      # released nothing it would cheerfully return the last one.
      - name: which tag
        id: tag
        if: steps.release.outputs.releases_created == 'true'
        run: |
          git fetch --tags --force --quiet origin
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::released, but $tag is not a tag here." \
                 "Has release-plz changed how it names tags?"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "attaching the extension to $tag"

  assets:
    name: attach the extension
    needs: release
    # Only when something was actually released. Every push to main runs this workflow, and
    # most of them release nothing.
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  release-pr:
    name: release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Never two at once: both would force-push the same branch, and the loser would leave a
    # pull request describing a release that is not the one main is on.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: release-plz/action@a80d79efe0a195618acb02a4089d55fe74d2505f # v0.5.136
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
