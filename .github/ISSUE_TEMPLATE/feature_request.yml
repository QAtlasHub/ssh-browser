name: "Feature request"
description: "Propose a feature, behavior change, or enhancement."
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ssh-browser has a deliberately narrow scope: serve files from a host reachable only over SSH as a real browser origin, without installing anything on that host and without writing to it. No telemetry, no self-update. Out-of-scope ideas are welcome in Discussions instead.
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which half would this land in?"
      options:
        - daemon - SSH/SFTP transport
        - daemon - the http origin (serving, caching, prefetch)
        - daemon - the directory tree and its themes
        - extension - dashboard, PAC, omnibox
        - packaging and release
        - unknown
    validations:
      required: true
  - type: textarea
    id: problem-statement
    attributes:
      label: "Problem statement"
      description: "What problem does this solve? Whose problem?"
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: "Proposed solution"
      description: "Describe the proposed change in enough detail that a reviewer could evaluate scope and effort."
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: "Alternatives considered"
      description: "What other approaches did you consider? Why did you reject them? (Optional but encouraged.)"
    validations:
      required: false
  - type: checkboxes
    id: scope-sanity
    attributes:
      label: "Scope sanity"
      options:
        - label: "This fits what ssh-browser is for: seeing a site on an SSH-only host work, without deploying it there"
          required: true
        - label: "This does not introduce telemetry / phone-home / self-update"
          required: true
        - label: "This does not write anything to the remote host"
          required: true
