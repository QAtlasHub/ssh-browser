<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>a filename that needs escaping</title>
  </head>
  <body>
    <!-- The name has a space in it on purpose. A document is identified to the daemon by its
         path, and a path that needs percent-escaping is where the two directions of the
         annotation API can disagree about what that path is. They did. -->
    <p id="quoted">anchor me here</p>
  </body>
