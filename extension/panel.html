<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ssh-browser</title>
    <style>
      body {
        font: 13px/1.5 system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 320px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      label {
        display: block;
        margin-top: 8px;
      }
      input {
        box-sizing: border-box;
        font: inherit;
        margin-top: 2px;
        padding: 4px 6px;
        width: 100%;
      }
      button {
        font: inherit;
        margin-top: 10px;
        padding: 5px 10px;
      }
      #status {
        margin-top: 10px;
        white-space: pre-wrap;
      }
      #status.bad {
        color: #b00020;
      }
      ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <h1>ssh-browser</h1>
    <label>
      Port
      <input id="port" type="number" min="1" max="65535" value="7391" />
    </label>
    <label>
      Control token
      <input id="token" type="password" autocomplete="off" spellcheck="false" />
    </label>
    <button id="connect">Connect</button>
    <div id="status"></div>
    <ul id="aliases"></ul>
    <script type="module" src="panel.js"></script>
  </body>
</html>
