[package]
name = "ssh-browser"
description = "Open files on an SSH host as a real browser origin."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }

[[bin]]
name = "measure-roundtrips"
path = "src/bin/measure_roundtrips.rs"
