[package]
name = "ssh-browser"
description = "Open files on an SSH host as a real browser origin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["ssh", "sftp", "browser", "proxy", "origin"]
# What it does, and what it is once installed. Both are true, and a daemon nobody starts
# from a shell would be neither.
categories = ["network-programming", "command-line-utilities"]

# Where the built binaries are, so `cargo binstall ssh-browser` takes one instead of
# compiling. Nothing but `cargo-binstall` reads this table; cargo ignores `package.metadata`.
#
# Spelled out rather than left to its defaults, because it tries several shapes and a
# near-miss falls back to building from source — which is the C compiler this exists to avoid,
# arrived at silently. The names come from `release-assets.yml`; if one moves, both move.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ssh-browser-{ target }{ binary-ext }"
# Not an archive. One file is the whole program, and unpacking a tarball that contains a
# single binary is a step which exists only because most projects have more than one.
pkg-fmt = "bin"

[lints]
workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "crypto", "ring", "x509-parser"] }
ring = "0.17.14"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "logging", "tls12"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
x509-parser = "0.18.1"

# `measure-roundtrips` is an example, not a binary, and the difference matters once this is
# published: `cargo install` puts every `[[bin]]` on the reader's PATH, and a command called
# `measure-roundtrips` means nothing outside this project and could collide with anything.
# It is also, literally, a program that uses this library — which is what an example is.
# Cargo finds it under `examples/`, so there is nothing to declare here.
